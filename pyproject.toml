[project]
name = "search-engines"
version = "0.1.1"
description = "Gives access to scraped search engines without authenticated/API keys"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.5",
    "aiohttp-socks>=0.12.0",
    "chompjs>=1.4.1",
    "curl-cffi>=0.17.0",
    "markdownify>=1.2.3",
]

[project.scripts]
search-engines = "search_engines:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
